[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentcheck"
version = "0.0.1"
description = "Statistical regression testing for LLM agent evaluations built on Inspect."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added in the step that first needs them.
# inspect_ai's API changes between releases: the upper bound makes upgrades deliberate.
dependencies = [
    "inspect-ai>=0.3.283,<0.4",
    "python-dotenv>=1.0",
    # Vectorised permutation tests. Already installed with inspect-ai; listed because we import it.
    "numpy>=1.26",
]

# Registers our tasks with Inspect so logs can be resumed (`eval_retry`). Inspect looks
# tasks up by package name, so the entry point name must be "agentcheck".
[project.scripts]
agentcheck = "agentcheck.cli:main"

[project.entry-points.inspect_ai]
agentcheck = "agentcheck._registry"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # Reference implementations for tests only. The statistics core never imports SciPy.
    "scipy>=1.15",
    "statsmodels>=0.14",
]
# Model provider for real runs. Not needed for tests, which use Inspect's mockllm.
groq = [
    "groq>=0.28",
    # inspect_ai's groq provider imports shared helpers that depend on the openai SDK.
    "openai>=3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simplifications, RUF: ruff-specific, PT: pytest style, BLE: no blind `except Exception`.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT", "BLE"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# SciPy ships without complete type hints; it is only used in tests.
module = ["scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# Any warning is a test failure: silent problems are how agentlens went wrong.
# Third-party exceptions are listed narrowly (exact message), each with a reason.
filterwarnings = [
    "error",
    # inspect_ai 0.3.283 calls tenacity.wait_exponential_jitter(initial=...), deprecated
    # in recent tenacity. Not our code; remove once inspect_ai updates.
    "ignore:The 'initial' parameter is deprecated:DeprecationWarning",
    # An anyio memory stream inside inspect_ai's eval loop is garbage-collected unclosed;
    # pytest reports it as an unraisable exception. Not our code; revisit on upgrade.
    "ignore:Exception ignored .*MemoryObjectReceiveStream:pytest.PytestUnraisableExceptionWarning",
]
