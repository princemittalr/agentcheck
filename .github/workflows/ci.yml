name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.11 is the oldest version we claim to support; 3.14 is what we develop on.
        python-version: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Each step exits non-zero on any problem, which fails the job.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest

  # Runs the composite action in action.yml on offline demo logs: an A/A pair must pass,
  # and a candidate with 12 of 60 questions broken must fail the step.
  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write demo logs
        run: |
          python -m pip install .
          python -m agentcheck.demo demo --name baseline
          python -m agentcheck.demo demo --name same
          python -m agentcheck.demo demo --name broken --wrong 12

      - name: A/A must pass
        id: aa
        uses: ./
        with:
          baseline: demo/baseline.eval
          candidate: demo/same.eval

      - name: Broken candidate must fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          baseline: demo/baseline.eval
          candidate: demo/broken.eval

      - name: Check outcomes
        env:
          AA: ${{ steps.aa.outputs.verdict }}
          BROKEN: ${{ steps.broken.outputs.verdict }}
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          echo "A/A: $AA; broken: $BROKEN, step $OUTCOME"
          test "$AA" = inconclusive
          test "$BROKEN" = regression
          test "$OUTCOME" = failure
