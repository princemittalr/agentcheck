name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.11 is the oldest version we claim to support; 3.14 is what we develop on.
        python-version: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Each step exits non-zero on any problem, which fails the job.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest
